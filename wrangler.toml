# Wrangler configuration — Educational Media Portal
#
# Before the first deploy:
#   1. npm install
#   2. npx wrangler d1 create media-db      -> 
#   3. npx wrangler r2 bucket create media
#   4. npm run db:migrate:remote
#   5. npx wrangler secret put ADMIN_BOOTSTRAP_PASSWORD   (optional, see README)
#   6. npm run deploy

name = "edu-media-portal"
main = "worker/src/index.ts"
compatibility_date = "2024-11-01"

# The built React app is served by the same Worker as the API, so the kiosk
# tablet only ever talks to one origin (no CORS, no second deploy).
[assets]
directory = "./frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# API and media routes are handled by the Worker; everything else falls
# through to the static assets / SPA fallback.
run_worker_first = ["/api/*", "/media/*"]

[[d1_databases]]
binding = "DB"
database_name = "media-db"
# TODO: replace with the id printed by `wrangler d1 create media-db`
database_id = "7e89a2fc-13f8-43be-b36f-a149cf484546"
migrations_dir = "./migrations"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "media"

[vars]
# Largest single upload accepted, in bytes (2 GB).
MAX_UPLOAD_BYTES = "2147483648"
# Session lifetime in days.
SESSION_TTL_DAYS = "7"
# Comma separated list of extra origins allowed to call the API.
# Leave empty when the frontend is served by this Worker (same origin).
ALLOWED_ORIGINS = ""

# Aborts multipart uploads and removes rows that were never completed.
[triggers]
crons = ["17 3 * * *"]
